<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Exposure Limits Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .search-section {
            margin-bottom: 30px;
        }
        
        .search-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .search-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
        }
        
        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .control-group input,
        .control-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-reset:hover {
            background: #e0e0e0;
        }
        
        .btn-export {
            background: #27ae60;
            color: white;
        }
        
        .btn-export:hover {
            background: #229954;
            transform: translateY(-2px);
        }
        
        .btn-upload {
            background: #f39c12;
            color: white;
        }
        
        .btn-upload:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }
        
        #fileInput {
            display: none;
        }
        
        .results-section {
            margin-top: 30px;
        }
        
        .results-info {
            margin-bottom: 15px;
            padding: 12px;
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
        }
        
        .results-list {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        
        .result-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            background: white;
        }
        
        .result-item:hover {
            background: #f9f9f9;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .chemical-name {
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .chemical-details {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        
        .detail-row {
            margin-bottom: 6px;
        }
        
        .detail-label {
            font-weight: 600;
            color: #333;
            display: inline-block;
            min-width: 120px;
        }
        
        .detail-value {
            color: #666;
        }
        
        .highlight {
            background-color: #fff3cd;
            font-weight: 500;
            padding: 2px 4px;
            border-radius: 2px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .info-banner {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1565c0;
        }
        
        @media (max-width: 768px) {
            .search-controls {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Chemical Exposure Limits Search</h1>
            <p>Search by Chemical Name, Synonym, or CAS Number</p>
        </div>
        
        <div class="content">
            <div class="info-banner">
                💡 <strong>How to use:</strong> Paste your Google Doc table data below or search the sample data. Click "Upload Data" to paste chemical data.
            </div>
            
            <div class="search-section">
                <h2>Search Chemicals</h2>
                
                <div class="search-controls">
                    <div class="control-group">
                        <label for="chemicalSearch">Chemical Name / Synonym</label>
                        <input type="text" id="chemicalSearch" placeholder="e.g., Asbestos, Silicon dioxide...">
                    </div>
                    <div class="control-group">
                        <label for="casSearch">CAS Number</label>
                        <input type="text" id="casSearch" placeholder="e.g., 1332-21-4">
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn-search" onclick="performSearch()">🔍 Search</button>
                    <button class="btn-reset" onclick="resetSearch()">↺ Reset</button>
                    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">📤 Upload Data</button>
                    <button class="btn-export" onclick="exportToCSV()">📥 Export Results</button>
                </div>
                
                <input type="file" id="fileInput" accept=".txt,.csv,.json" onchange="handleFileUpload(event)">
            </div>
            
            <div class="stats" id="statsContainer" style="display: none;">
                <div class="stat-card">
                    <div class="stat-value" id="totalRecords">0</div>
                    <div class="stat-label">Total Chemicals</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="matchedRecords">0</div>
                    <div class="stat-label">Matched</div>
                </div>
            </div>
            
            <div class="results-section">
                <div class="results-info" id="resultsInfo" style="display: none;"></div>
                <div class="results-list" id="resultsList">
                    <div class="no-results">Enter search terms to find chemicals...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allChemicals = [];
        let filteredChemicals = [];

        // Sample data structure - replace with actual Google Doc data
        const sampleData = `
Chemical Name,Synonyms,CAS Number,TWA (mg/m³),STEL (mg/m³),Carcinogen,Notes
Asbestos,Asbestos fibres; chrysotile; crocidolite; amosite,1332-21-4,0.1 f/mL,N/A,1A,Respirable fibres
Crystalline Silica,Quartz; silicon dioxide; SiO2,14808-60-7,0.025,N/A,1A,Respirable dust
Lead,Lead metal; Pb,7439-92-1,0.05,N/A,1B,Inorganic lead compounds
Benzene,C6H6; phenyl hydride,71-43-2,1 ppm,5 ppm,1A,Aromatic hydrocarbon
Carbon Monoxide,CO; carbon oxide,630-08-0,25 ppm,N/A,No,"Colorless, odorless gas"
Formaldehyde,Methanal; HCHO; methyl aldehyde,50-00-0,0.5 ppm,N/A,1A,Gas at room temperature
Toluene,Methylbenzene; C7H8; toluol,108-88-3,50 ppm,100 ppm,No,Volatile organic compound
Xylene,Dimethylbenzene; xylol; C8H10,1330-20-7,100 ppm,150 ppm,No,"ortho-, meta-, para- isomers"
Acetone,Propanone; 2-propanone; dimethyl ketone,67-64-1,500 ppm,1000 ppm,No,Volatile solvent
Ethanol,Ethyl alcohol; CH3CH2OH; grain alcohol,64-17-5,1000 ppm,N/A,2A,Aliphatic alcohol
        `;

        // Initialize
        window.addEventListener('load', function() {
            parseChemicalData(sampleData);
        });

        // Parse chemical data from text/CSV
        function parseChemicalData(data) {
            allChemicals = [];
            const lines = data.trim().split('\n');
            
            if (lines.length < 2) {
                alert('Invalid data format. Please use CSV format with headers.');
                return;
            }

            // Parse header
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const nameIdx = headers.indexOf('chemical name');
            const synonymsIdx = headers.indexOf('synonyms');
            const casIdx = headers.indexOf('cas number');

            // If standard headers don't exist, try to guess
            if (nameIdx === -1 || casIdx === -1) {
                alert('CSV must contain "Chemical Name" and "CAS Number" columns');
                return;
            }

            // Parse rows
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const parts = parseCSVLine(line);
                if (parts.length > Math.max(nameIdx, casIdx)) {
                    allChemicals.push({
                        name: parts[nameIdx] ? parts[nameIdx].trim() : '',
                        synonyms: synonymsIdx !== -1 && parts[synonymsIdx] ? parts[synonymsIdx].trim() : '',
                        cas: casIdx !== -1 && parts[casIdx] ? parts[casIdx].trim() : '',
                        twa: headers.includes('twa') ? parts[headers.indexOf('twa')] || '' : '',
                        stel: headers.includes('stel') ? parts[headers.indexOf('stel')] || '' : '',
                        carcinogen: headers.includes('carcinogen') ? parts[headers.indexOf('carcinogen')] || '' : '',
                        notes: headers.includes('notes') ? parts[headers.indexOf('notes')] || '' : ''
                    });
                }
            }

            filteredChemicals = JSON.parse(JSON.stringify(allChemicals));
            updateStats();
            displayResults();
        }

        // Parse CSV line (handles quoted values)
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }

        // Handle file upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                parseChemicalData(content);
                alert(`Loaded ${allChemicals.length} chemicals from file`);
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Perform search
        function performSearch() {
            const chemicalValue = document.getElementById('chemicalSearch').value.toLowerCase();
            const casValue = document.getElementById('casSearch').value.toLowerCase();

            filteredChemicals = allChemicals.filter(item => {
                let match = true;

                if (chemicalValue) {
                    const nameMatch = item.name.toLowerCase().includes(chemicalValue);
                    const synonymMatch = item.synonyms.toLowerCase().includes(chemicalValue);
                    match = match && (nameMatch || synonymMatch);
                }

                if (casValue) {
                    match = match && item.cas.toLowerCase().includes(casValue);
                }

                return match;
            });

            updateStats();
            displayResults();
        }

        // Reset search
        function resetSearch() {
            document.getElementById('chemicalSearch').value = '';
            document.getElementById('casSearch').value = '';
            filteredChemicals = JSON.parse(JSON.stringify(allChemicals));
            updateStats();
            displayResults();
        }

        // Display results
        function displayResults() {
            const resultsList = document.getElementById('resultsList');
            const resultsInfo = document.getElementById('resultsInfo');

            if (filteredChemicals.length === 0) {
                resultsList.innerHTML = '<div class="no-results">No chemicals found matching your search criteria.</div>';
                resultsInfo.style.display = 'none';
                return;
            }

            let html = '';
            filteredChemicals.forEach(chemical => {
                html += `
                    <div class="result-item">
                        <div class="chemical-name">${escapeHtml(chemical.name)}</div>
                        <div class="chemical-details">
                            ${chemical.synonyms ? `<div class="detail-row"><span class="detail-label">Synonyms:</span> <span class="detail-value">${escapeHtml(chemical.synonyms)}</span></div>` : ''}
                            ${chemical.cas ? `<div class="detail-row"><span class="detail-label">CAS Number:</span> <span class="detail-value"><strong>${escapeHtml(chemical.cas)}</strong></span></div>` : ''}
                            ${chemical.twa ? `<div class="detail-row"><span class="detail-label">TWA:</span> <span class="detail-value">${escapeHtml(chemical.twa)}</span></div>` : ''}
                            ${chemical.stel ? `<div class="detail-row"><span class="detail-label">STEL:</span> <span class="detail-value">${escapeHtml(chemical.stel)}</span></div>` : ''}
                            ${chemical.carcinogen ? `<div class="detail-row"><span class="detail-label">Carcinogen:</span> <span class="detail-value"><strong>${escapeHtml(chemical.carcinogen)}</strong></span></div>` : ''}
                            ${chemical.notes ? `<div class="detail-row"><span class="detail-label">Notes:</span> <span class="detail-value">${escapeHtml(chemical.notes)}</span></div>` : ''}
                        </div>
                    </div>
                `;
            });

            resultsList.innerHTML = html;
            resultsInfo.style.display = 'block';
            resultsInfo.innerHTML = `✓ Found <strong>${filteredChemicals.length}</strong> of <strong>${allChemicals.length}</strong> chemicals`;
        }

        // Update statistics
        function updateStats() {
            document.getElementById('statsContainer').style.display = 'grid';
            document.getElementById('totalRecords').textContent = allChemicals.length;
            document.getElementById('matchedRecords').textContent = filteredChemicals.length;
        }

        // Export to CSV
        function exportToCSV() {
            if (filteredChemicals.length === 0) {
                alert('No results to export');
                return;
            }

            const headers = ['Chemical Name', 'Synonyms', 'CAS Number', 'TWA', 'STEL', 'Carcinogen', 'Notes'];
            let csv = headers.join(',') + '\n';

            filteredChemicals.forEach(item => {
                const row = [
                    `"${item.name.replace(/"/g, '""')}"`,
                    `"${item.synonyms.replace(/"/g, '""')}"`,
                    `"${item.cas.replace(/"/g, '""')}"`,
                    `"${item.twa.replace(/"/g, '""')}"`,
                    `"${item.stel.replace(/"/g, '""')}"`,
                    `"${item.carcinogen.replace(/"/g, '""')}"`,
                    `"${item.notes.replace(/"/g, '""')}"`
                ];
                csv += row.join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chemicals-search-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Allow Enter key to search
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && (e.target.id === 'chemicalSearch' || e.target.id === 'casSearch')) {
                performSearch();
            }
        });
    </script>
</body>
</html>
